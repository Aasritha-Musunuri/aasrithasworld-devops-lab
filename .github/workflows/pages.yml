name: Publish DevOps Lab

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get website code
        uses: actions/checkout@v6
      - name: Get the current learning notes
        uses: actions/checkout@v6
        with:
          repository: Aasritha-Musunuri/Devops
          ref: main
          path: .lesson-source
          persist-credentials: false
      - name: Prepare lesson data for this deployment
        run: node build-lessons.cjs .lesson-source/DevOps-Learning-Journey dist/lessons.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
