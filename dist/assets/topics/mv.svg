<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc"><title id="title">Move changes where the file is found</title><desc id="desc">Before: mv-old.txt: One file in the current folder. Rename: mv old new: The filename changes. Move: mv new archive/: The file now lives in archive</desc><rect width="1080" height="510" rx="18" fill="#121827"/><text x="38" y="40" fill="#74e9d7" font-family="Segoe UI,Arial" font-size="11" letter-spacing="2">AASRITHA’S WORLD / VISUAL NOTES</text><text x="38" y="86" fill="#edf1fb" font-family="Segoe UI,Arial" font-size="28" font-weight="700">Move changes where the file is found</text><g transform="translate(38,115)"><rect width="312" height="258" rx="12" fill="#0c101b" stroke="#263047"/><text x="20" y="29" fill="#8f9bb2" font-family="Consolas,monospace" font-size="11">01</text><g transform="translate(120,25)" fill="none" stroke="#74e9d7" stroke-width="2"><path d="M6 15h23l8 8h31v39H6z"/><path d="M6 24h62M17 38h30M17 47h23"/></g><text x="20" y="131" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">Before</text><text x="20" y="163" fill="#edf1fb" font-family="Segoe UI,Arial" font-size="19" font-weight="600">mv-old.txt</text><text x="20" y="219" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">One file in the current folder</text></g><text x="363" y="249" fill="#a094ff" font-size="22">→</text><g transform="translate(384,115)"><rect width="312" height="258" rx="12" fill="#0c101b" stroke="#263047"/><text x="20" y="29" fill="#8f9bb2" font-family="Consolas,monospace" font-size="11">02</text><g transform="translate(120,25)" fill="none" stroke="#a094ff" stroke-width="2"><path d="M6 15h23l8 8h31v39H6z"/><path d="M6 24h62M17 38h30M17 47h23"/></g><text x="20" y="131" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">Rename</text><text x="20" y="163" fill="#edf1fb" font-family="Segoe UI,Arial" font-size="19" font-weight="600">mv old new</text><text x="20" y="219" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">The filename changes</text></g><text x="709" y="249" fill="#a094ff" font-size="22">→</text><g transform="translate(730,115)"><rect width="312" height="258" rx="12" fill="#0c101b" stroke="#263047"/><text x="20" y="29" fill="#8f9bb2" font-family="Consolas,monospace" font-size="11">03</text><g transform="translate(120,25)" fill="none" stroke="#80b1f7" stroke-width="2"><path d="M6 15h23l8 8h31v39H6z"/><path d="M6 24h62M17 38h30M17 47h23"/></g><text x="20" y="131" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">Move</text><text x="20" y="163" fill="#edf1fb" font-family="Segoe UI,Arial" font-size="19" font-weight="600">mv new archive/</text><text x="20" y="219" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">The file now lives in archive</text></g><path d="M38 400h1004" stroke="#263047"/><text x="38" y="432" fill="#a6b2c8" font-family="Segoe UI,Arial" font-size="14">A move does not leave an extra copy at the old path.</text></svg>