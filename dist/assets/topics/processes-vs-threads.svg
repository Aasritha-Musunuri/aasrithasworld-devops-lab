<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc"><title id="title">One running app, several workers</title><desc id="desc">Process: Running application: Own address space. Threads: Workers inside it: Share process memory. CPU: Executes threads: Schedules their work</desc><rect width="1080" height="510" rx="18" fill="#121827"/><text x="38" y="40" fill="#74e9d7" font-family="Segoe UI,Arial" font-size="11" letter-spacing="2">AASRITHA’S WORLD / VISUAL NOTES</text><text x="38" y="86" fill="#edf1fb" font-family="Segoe UI,Arial" font-size="28" font-weight="700">One running app, several workers</text><g transform="translate(38,115)"><rect width="312" height="258" rx="12" fill="#0c101b" stroke="#263047"/><text x="20" y="29" fill="#8f9bb2" font-family="Consolas,monospace" font-size="11">01</text><g transform="translate(120,25)" fill="none" stroke="#74e9d7" stroke-width="2"><rect x="18" y="15" width="38" height="40" rx="5"/><rect x="28" y="25" width="18" height="20" rx="2"/><path d="M8 25h10M8 45h10M56 25h10M56 45h10M28 5v10M46 5v10M28 55v10M46 55v10"/></g><text x="20" y="131" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">Process</text><text x="20" y="163" fill="#edf1fb" font-family="Segoe UI,Arial" font-size="19" font-weight="600">Running application</text><text x="20" y="219" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">Own address space</text></g><text x="363" y="249" fill="#a094ff" font-size="22">·</text><g transform="translate(384,115)"><rect width="312" height="258" rx="12" fill="#0c101b" stroke="#263047"/><text x="20" y="29" fill="#8f9bb2" font-family="Consolas,monospace" font-size="11">02</text><g transform="translate(120,25)" fill="none" stroke="#a094ff" stroke-width="2"><ellipse cx="37" cy="16" rx="26" ry="9"/><path d="M11 16v40c0 12 52 12 52 0V16M11 36c0 12 52 12 52 0"/></g><text x="20" y="131" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">Threads</text><text x="20" y="163" fill="#edf1fb" font-family="Segoe UI,Arial" font-size="19" font-weight="600">Workers inside it</text><text x="20" y="219" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">Share process memory</text></g><text x="709" y="249" fill="#a094ff" font-size="22">·</text><g transform="translate(730,115)"><rect width="312" height="258" rx="12" fill="#0c101b" stroke="#263047"/><text x="20" y="29" fill="#8f9bb2" font-family="Consolas,monospace" font-size="11">03</text><g transform="translate(120,25)" fill="none" stroke="#80b1f7" stroke-width="2"><rect x="18" y="15" width="38" height="40" rx="5"/><rect x="28" y="25" width="18" height="20" rx="2"/><path d="M8 25h10M8 45h10M56 25h10M56 45h10M28 5v10M46 5v10M28 55v10M46 55v10"/></g><text x="20" y="131" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">CPU</text><text x="20" y="163" fill="#edf1fb" font-family="Segoe UI,Arial" font-size="19" font-weight="600">Executes threads</text><text x="20" y="219" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">Schedules their work</text></g><path d="M38 400h1004" stroke="#263047"/><text x="38" y="432" fill="#a6b2c8" font-family="Segoe UI,Arial" font-size="14">Separate processes normally have separate memory; threads in one process share memory.</text></svg>