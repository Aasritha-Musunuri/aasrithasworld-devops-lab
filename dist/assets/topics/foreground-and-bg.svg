<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc"><title id="title">Paused and background are different states</title><desc id="desc">Foreground: sleep 300: The terminal is occupied. Ctrl+Z: Stopped: The job is paused. bg / fg: Resume the job: Background or foreground</desc><rect width="1080" height="510" rx="18" fill="#121827"/><text x="38" y="40" fill="#74e9d7" font-family="Segoe UI,Arial" font-size="11" letter-spacing="2">AASRITHA’S WORLD / VISUAL NOTES</text><text x="38" y="86" fill="#edf1fb" font-family="Segoe UI,Arial" font-size="28" font-weight="700">Paused and background are different states</text><g transform="translate(38,115)"><rect width="312" height="258" rx="12" fill="#0c101b" stroke="#263047"/><text x="20" y="29" fill="#8f9bb2" font-family="Consolas,monospace" font-size="11">01</text><g transform="translate(120,25)" fill="none" stroke="#74e9d7" stroke-width="2"><rect x="5" y="10" width="65" height="48" rx="6"/><path d="M5 22h65M18 32l9 7-9 7M36 46h15"/><circle cx="14" cy="16" r="1"/></g><text x="20" y="131" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">Foreground</text><text x="20" y="163" fill="#edf1fb" font-family="Segoe UI,Arial" font-size="19" font-weight="600">sleep 300</text><text x="20" y="219" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">The terminal is occupied</text></g><text x="363" y="249" fill="#a094ff" font-size="22">→</text><g transform="translate(384,115)"><rect width="312" height="258" rx="12" fill="#0c101b" stroke="#263047"/><text x="20" y="29" fill="#8f9bb2" font-family="Consolas,monospace" font-size="11">02</text><g transform="translate(120,25)" fill="none" stroke="#a094ff" stroke-width="2"><rect x="5" y="10" width="65" height="48" rx="6"/><path d="M5 22h65M18 32l9 7-9 7M36 46h15"/><circle cx="14" cy="16" r="1"/></g><text x="20" y="131" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">Ctrl+Z</text><text x="20" y="163" fill="#edf1fb" font-family="Segoe UI,Arial" font-size="19" font-weight="600">Stopped</text><text x="20" y="219" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">The job is paused</text></g><text x="709" y="249" fill="#a094ff" font-size="22">→</text><g transform="translate(730,115)"><rect width="312" height="258" rx="12" fill="#0c101b" stroke="#263047"/><text x="20" y="29" fill="#8f9bb2" font-family="Consolas,monospace" font-size="11">03</text><g transform="translate(120,25)" fill="none" stroke="#80b1f7" stroke-width="2"><rect x="5" y="10" width="65" height="48" rx="6"/><path d="M5 22h65M18 32l9 7-9 7M36 46h15"/><circle cx="14" cy="16" r="1"/></g><text x="20" y="131" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">bg / fg</text><text x="20" y="163" fill="#edf1fb" font-family="Segoe UI,Arial" font-size="19" font-weight="600">Resume the job</text><text x="20" y="219" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">Background or foreground</text></g><path d="M38 400h1004" stroke="#263047"/><text x="38" y="432" fill="#a6b2c8" font-family="Segoe UI,Arial" font-size="14">Ctrl+C interrupts; Ctrl+Z normally pauses. They are different actions.</text></svg>