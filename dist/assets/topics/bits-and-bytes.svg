<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc"><title id="title">Eight small switches make one byte</title><desc id="desc">A bit: 0 or 1: Two possible states. A byte: 8 bits together: 01000001. A file: Many bytes: Logs, images, packages</desc><rect width="1080" height="510" rx="18" fill="#121827"/><text x="38" y="40" fill="#74e9d7" font-family="Segoe UI,Arial" font-size="11" letter-spacing="2">AASRITHA’S WORLD / VISUAL NOTES</text><text x="38" y="86" fill="#edf1fb" font-family="Segoe UI,Arial" font-size="28" font-weight="700">Eight small switches make one byte</text><g transform="translate(38,115)"><rect width="312" height="258" rx="12" fill="#0c101b" stroke="#263047"/><text x="20" y="29" fill="#8f9bb2" font-family="Consolas,monospace" font-size="11">01</text><g transform="translate(120,25)" fill="none" stroke="#74e9d7" stroke-width="2"><rect x="5" y="10" width="65" height="48" rx="6"/><path d="M5 22h65M18 32l9 7-9 7M36 46h15"/><circle cx="14" cy="16" r="1"/></g><text x="20" y="131" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">A bit</text><text x="20" y="163" fill="#edf1fb" font-family="Segoe UI,Arial" font-size="19" font-weight="600">0 or 1</text><text x="20" y="219" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">Two possible states</text></g><text x="363" y="249" fill="#a094ff" font-size="22">→</text><g transform="translate(384,115)"><rect width="312" height="258" rx="12" fill="#0c101b" stroke="#263047"/><text x="20" y="29" fill="#8f9bb2" font-family="Consolas,monospace" font-size="11">02</text><g transform="translate(120,25)" fill="none" stroke="#a094ff" stroke-width="2"><rect x="5" y="10" width="65" height="48" rx="6"/><path d="M5 22h65M18 32l9 7-9 7M36 46h15"/><circle cx="14" cy="16" r="1"/></g><text x="20" y="131" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">A byte</text><text x="20" y="163" fill="#edf1fb" font-family="Segoe UI,Arial" font-