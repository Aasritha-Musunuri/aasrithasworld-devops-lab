<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc"><title id="title">Browse rather than flood the screen</title><desc id="desc">Open: less application.log: A pager takes over the terminal. Navigate: /ERROR · n · Space: Search and move through text. Leave: q: Return to the shell prompt</desc><rect width="1080" height="510" rx="18" fill="#121827"/><text x="38" y="40" fill="#74e9d7" font-family="Segoe UI,Arial" font-size="11" letter-spacing="2">AASRITHA’S WORLD / VISUAL NOTES</text><text x="38" y="86" fill="#edf1fb" font-family="Segoe UI,Arial" font-size="28" font-weight="700">Browse rather than flood the screen</text><g transform="translate(38,115)"><rect width="312" height="258" rx="12" fill="#0c101b" stroke="#263047"/><text x="20" y="29" fill="#8f9bb2" font-family="Consolas,monospace" font-size="11">01</text><g transform="translate(120,25)" fill="none" stroke="#74e9d7" stroke-width="2"><rect x="5" y="10" width="65" height="48" rx="6"/><path d="M5 22h65M18 32l9 7-9 7M36 46h15"/><circle cx="14" cy="16" r="1"/></g><text x="20" y="131" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">Open</text><text x="20" y="163" fill="#edf1fb" font-family="Segoe UI,Arial" font-size="19" font-weight="600">less application.log</text><text x="20" y="219" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">A pager takes over the terminal</text></g><text x="363" y="249" fill="#a094ff" font-size="22">→</text><g transform="translate(384,115)"><rect width="312" height="258" rx="12" fill="#0c101b" stroke="#263047"/><text x="20" y="29" fill="#8f9bb2" font-family="Consolas,monospace" font-size="11">02</text><g transform="translate(120,25)" fill="none" stroke="#a094ff" stroke-width="2"><rect x="5" y="10" width="65" height="48" rx="6"/><path d="M5 22h65M18 32l9 7-9 7M36 46h15"/><circle cx="14" cy="16" r="1"/></g><text x="20" y="131" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">Navigate</text><text x="20" y="163" fill="#edf1fb" font-family="Segoe UI,Arial" font-size="19" font-weight="600">/ERROR · n · Space</text><text x="20" y="219" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">Search and move through text</text></g><text x="709" y="249" fill="#a094ff" font-size="22">→</text><g transform="translate(730,115)"><rect width="312" height="258" rx="12" fill="#0c101b" stroke="#263047"/><text x="20" y="29" fill="#8f9bb2" font-family="Consolas,monospace" font-size="11">03</text><g transform="translate(120,25)" fill="none" stroke="#80b1f7" stroke-width="2"><rect x="5" y="10" width="65" height="48" rx="6"/><path d="M5 22h65M18 32l9 7-9 7M36 46h15"/><circle cx="14" cy="16" r="1"/></g><text x="20" y="131" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">Leave</text><text x="20" y="163" fill="#edf1fb" font-family="Segoe UI,Arial" font-size="19" font-weight="600">q</text><text x="20" y="219" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">Return to the shell prompt</text></g><path d="M38 400h1004" stroke="#263047"/><text x="38" y="432" fill="#a6b2c8" font-family="Segoe UI,Arial" font-size="14">less is a viewer, not an editor. Searching does not modify the file.</text></svg>