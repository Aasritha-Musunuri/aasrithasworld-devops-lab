<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc"><title id="title">Sharing a limited amount of CPU time</title><desc id="desc">Ready tasks: App A · App B · App C: Waiting for CPU time. Scheduler: Chooses what runs: Based on scheduling policy. CPU time: A → B → A → C: Simplified time sharing</desc><rect width="1080" height="510" rx="18" fill="#121827"/><text x="38" y="40" fill="#74e9d7" font-family="Segoe UI,Arial" font-size="11" letter-spacing="2">AASRITHA’S WORLD / VISUAL NOTES</text><text x="38" y="86" fill="#edf1fb" font-family="Segoe UI,Arial" font-size="28" font-weight="700">Sharing a limited amount of CPU time</text><g transform="translate(38,115)"><rect width="312" height="258" rx="12" fill="#0c101b" stroke="#263047"/><text x="20" y="29" fill="#8f9bb2" font-family="Consolas,monospace" font-size="11">01</text><g transform="translate(120,25)" fill="none" stroke="#74e9d7" stroke-width="2"><rect x="18" y="15" width="38" height="40" rx="5"/><rect x="28" y="25" width="18" height="20" rx="2"/><path d="M8 25h10M8 45h10M56 25h10M56 45h10M28 5v10M46 5v10M28 55v10M46 55v10"/></g><text x="20" y="131" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">Ready tasks</text><text x="20" y="163" fill="#edf1fb" font-family="Segoe UI,Arial" font-size="19" font-weight="600">App A · App B · App C</text><text x="20" y="219" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">Waiting for CPU time</text></g><text x="363" y="249" fill="#a094ff" font-size="22">→</text><g transform="translate(384,115)"><rect width="312" height="258" rx="12" fill="#0c101b" stroke="#263047"/><text x="20" y="29" fill="#8f9bb2" font-family="Consolas,monospace" font-size="11">02</text><g transform="translate(120,25)" fill="none" stroke="#a094ff" stroke-width="2"><rect x="5" y="10" width="65" height="48" rx="6"/><path d="M5 22h65M18 32l9 7-9 7M36 46h15"/><circle cx="14" cy="16" r="1"/></g><text x="20" y="131" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">Scheduler</text><text x="20" y="163" fill="#edf1fb" font-family="Segoe UI,Arial" font-size="19" font-weight="600">Chooses what runs</text><text x="20" y="219" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">Based on scheduling policy</text></g><text x="709" y="249" fill="#a094ff" font-size="22">→</text><g transform="translate(730,115)"><rect width="312" height="258" rx="12" fill="#0c101b" stroke="#263047"/><text x="20" y="29" fill="#8f9bb2" font-family="Consolas,monospace" font-size="11">03</text><g transform="translate(120,25)" fill="none" stroke="#80b1f7" stroke-width="2"><rect x="18" y="15" width="38" height="40" rx="5"/><rect x="28" y="25" width="18" height="20" rx="2"/><path d="M8 25h10M8 45h10M56 25h10M56 45h10M28 5v10M46 5v10M28 55v10M46 55v10"/></g><text x="20" y="131" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">CPU time</text><text x="20" y="163" fill="#edf1fb" font-family="Segoe UI,Arial" font-size="19" font-weight="600">A → B → A → C</text><text x="20" y="219" fill="#8f9bb2" font-family="Segoe UI,Arial" font-size="13">Simplified time sharing</text></g><path d="M38 400h1004" stroke="#263047"/><text x="38" y="432" fill="#a6b2c8" font-family="Segoe UI,Arial" font-size="14">With multiple cores, several threads can run at once.</text></svg>